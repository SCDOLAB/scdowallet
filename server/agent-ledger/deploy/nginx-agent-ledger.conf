# included inside the scdoscan.io / apeccapital.org / scdo.com.au server blocks
location = /agent-ledger { return 301 /agent-ledger/; }
location /agent-ledger/api/ {
    limit_except GET POST { deny all; }
    client_max_body_size 16k;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:8147;
}
location /agent-ledger/ { alias /usr/share/nginx/agent-ledger/; index index.html; }

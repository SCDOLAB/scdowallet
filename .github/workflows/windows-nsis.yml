name: windows-nsis
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - 'release/**'
      - 'cursor/**'
jobs:
  unsigned-nsis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32 wine64
      - name: Build unsigned NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          USE_SYSTEM_WINE: 'true'
        run: npm run dist:win:nsis
      - name: Record SHA-256
        run: |
          mkdir -p nsis-out
          cp ../dist/SCDOWallet-*-win-x64-setup.exe nsis-out/
          (cd nsis-out && sha256sum SCDOWallet-*-win-x64-setup.exe | tee SHA256SUMS)
      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: SCDOWallet-3.0.1-win-x64-setup
          path: nsis-out/*
          if-no-files-found: error

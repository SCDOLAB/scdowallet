name: linux-appimage
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - 'release/**'
      - 'cursor/**'
jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install AppImage tools
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - name: Build AppImage
        run: npm run dist:linux
      - name: Record size and SHA-256
        run: |
          mkdir -p linux-out
          cp ../dist/SCDOWallet-*-linux-x64.AppImage linux-out/
          ls -l linux-out/SCDOWallet-*-linux-x64.AppImage
          (cd linux-out && sha256sum SCDOWallet-*-linux-x64.AppImage | tee SHA256SUMS)
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SCDOWallet-linux-x64-AppImage
          path: linux-out/SCDOWallet-*-linux-x64.AppImage
          if-no-files-found: error

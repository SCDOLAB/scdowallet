name: tests
# Runs the wallet's own test suite (npm test) on every pull request and release push.
# The build workflows only package the app; without this job a broken test never shows up on a PR.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - 'release/**'
      - 'cursor/**'
permissions:
  contents: read
jobs:
  npm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # test/lang-platform.js reads package.json from an older commit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

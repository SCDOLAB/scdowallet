<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 2.0.1: no 'unsafe-inline' / 'unsafe-eval' scripts, no http:, Trusted Types enforced for every HTML sink -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types scdo-parse scdo-html default">

    <img src="./assets/icon-128.png" alt="" width="96" height="96">

    <div class="bm" id="bootMine"></div>

    <nav class="tabs" id="tabs"></nav>
    <main id="main"></main>
